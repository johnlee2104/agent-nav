<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" role="img" aria-labelledby="t d">
<title id="t">agent-nav finds a file by purpose where grep finds nothing</title>
<desc id="d">An agent asks where retries are configured. grep -rn "retry" src/ returns no matches because the code says backoff and attempts. agent-nav find "where are retries configured" returns src/http/backoff.py, retries failed HTTP calls with exponential backoff.</desc>
<style>
text{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;font-size:15px;white-space:pre}
@keyframes l0{0%,2.31%{opacity:0}4.23%,90.77%{opacity:1}95.38%,100%{opacity:0}}@keyframes l1{0%,7.69%{opacity:0}9.62%,90.77%{opacity:1}95.38%,100%{opacity:0}}@keyframes c1{0%,7.69%{transform:translateX(0)}14.96%,100%{transform:translateX(193px)}}@keyframes l2{0%,20.00%{opacity:0}21.92%,90.77%{opacity:1}95.38%,100%{opacity:0}}@keyframes l3{0%,23.85%{opacity:0}25.77%,90.77%{opacity:1}95.38%,100%{opacity:0}}@keyframes l4{0%,33.85%{opacity:0}35.77%,90.77%{opacity:1}95.38%,100%{opacity:0}}@keyframes c4{0%,33.85%{transform:translateX(0)}49.42%,100%{transform:translateX(409px)}}@keyframes l5{0%,50.77%{opacity:0}52.69%,90.77%{opacity:1}95.38%,100%{opacity:0}}@keyframes cap{0%,56.92%{opacity:0;transform:translateY(6px)}60.00%,90.77%{opacity:1;transform:translateY(0)}95.38%,100%{opacity:0}}
.l0{animation:l0 13.0s linear infinite}.l1{animation:l1 13.0s linear infinite}.c1{animation:c1 13.0s steps(21,end) infinite}.l2{animation:l2 13.0s linear infinite}.l3{animation:l3 13.0s linear infinite}.l4{animation:l4 13.0s linear infinite}.c4{animation:c4 13.0s steps(45,end) infinite}.l5{animation:l5 13.0s linear infinite}.cap{animation:cap 13.0s ease-out infinite}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect x="0.5" y="0.5" width="879" height="329" rx="12" fill="#0d1117" stroke="#3d444d"/>
<path d="M0.5 44V12.5a12 12 0 0 1 12-12h855a12 12 0 0 1 12 12V44z" fill="#151b23"/>
<line x1="0.5" y1="44" x2="879.5" y2="44" stroke="#3d444d"/>
<circle cx="28" cy="22" r="6" fill="#ff5f57"/><circle cx="48" cy="22" r="6" fill="#febc2e"/><circle cx="68" cy="22" r="6" fill="#28c840"/>
<text x="440.0" y="27" text-anchor="middle" fill="#9198a1" style="font-size:13px">~/my-app</text>
<clipPath id="card"><rect x="1" y="45" width="878" height="284" rx="11"/></clipPath>
<g clip-path="url(#card)"><g class="l0"><text x="44" y="92" textLength="360" lengthAdjust="spacing"><tspan fill="#9198a1"># agent: &quot;where are retries configured?&quot;</tspan></text></g><g class="l1"><text x="44" y="122" textLength="207" lengthAdjust="spacing"><tspan fill="#3fb950">$ </tspan><tspan fill="#f0f6fc">grep -rn &quot;retry&quot; src/</tspan></text><rect class="c1" x="61" y="102" width="197" height="28" fill="#0d1117" style="transform:translateX(193px)"/></g><g class="l2"><text x="44" y="152" textLength="108" lengthAdjust="spacing"><tspan fill="#f0883e">(no matches)</tspan></text></g><g class="l3"><text x="44" y="182" textLength="495" lengthAdjust="spacing"><tspan fill="#656c76"># the code says &quot;backoff&quot; and &quot;attempts&quot;, never &quot;retry&quot;</tspan></text></g><g class="l4"><text x="44" y="220" textLength="423" lengthAdjust="spacing"><tspan fill="#3fb950">$ </tspan><tspan fill="#f0f6fc">agent-nav find &quot;where are retries configured&quot;</tspan></text><rect class="c4" x="61" y="200" width="413" height="28" fill="#0d1117" style="transform:translateX(409px)"/></g><g class="l5"><rect x="32" y="237" width="672.0" height="31" rx="6" fill="#121d2f" stroke="#1f6feb" stroke-width="1"/><text x="44" y="258" textLength="648" lengthAdjust="spacing"><tspan fill="#4493f8">src/http/backoff.py</tspan><tspan fill="#f0f6fc">   retries failed HTTP calls with exponential backoff</tspan></text></g><g class="cap"><text x="44" y="296" style="font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;font-size:14px" fill="#9198a1"><tspan fill="#3fb950" font-weight="600">✓</tspan><tspan dx="8">found by purpose, not by string</tspan><tspan dx="14" fill="#656c76">·</tspan><tspan dx="14">one tool call</tspan><tspan dx="14" fill="#656c76">·</tspan><tspan dx="14">no model call</tspan></text></g></g>
</svg>
